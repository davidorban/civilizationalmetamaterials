<text x="7.00" y="272.00" font-family="'STIX Two Text','Times New Roman',Georgia,serif" font-size="8.10" fill="#1B4F72" font-weight="bold" font-style="normal" text-anchor="start">Design levers</text>
<text x="7.00" y="284.00" font-family="'STIX Two Text','Times New Roman',Georgia,serif" font-size="7.00" fill="#1A1A1A" font-weight="normal" font-style="normal" text-anchor="start">Lower β · raise ρ · raise τ: together, not alone. Correlated detection (1−γρτ)</text>
