<text x="30.00" y="38.00" font-family="'STIX Two Text','Times New Roman',Georgia,serif" font-size="8.50" fill="#D68910" font-weight="bold" font-style="normal" text-anchor="start">THE TAKEAWAY</text>
<text x="30.00" y="56.00" font-family="'STIX Two Text','Times New Roman',Georgia,serif" font-size="9.50" fill="#FFFFFF" font-weight="normal" font-style="normal" text-anchor="start">Treat coordination as a material to be engineered. Specify the microstructure: provenance, verification, delegation limits; so the macroscopic property you need</text>
<text x="30.00" y="68.54" font-family="'STIX Two Text','Times New Roman',Georgia,serif" font-size="9.50" fill="#FFFFFF" font-weight="normal" font-style="normal" text-anchor="start">(R<tspan font-size="5.89" baseline-shift="-18%">eff</tspan> &lt; 1) emerges by design rather than by hope. Governance becomes falsifiable, measurable, and buildable.</text>
<text x="30.00" y="116.00" font-family="'STIX Two Text','Times New Roman',Georgia,serif" font-size="7.80" fill="#AED6F1" font-weight="normal" font-style="normal" text-anchor="start">Paper, code, reference implementation and an interactive R<tspan font-size="4.84" baseline-shift="-18%">eff</tspan> explorer:</text>
